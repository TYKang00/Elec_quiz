.120"}, {"id": 531, "chap": "11 조명", "topic": "배광", "q": "직접조명 기구에서 차광각이란 무엇인가?", "ans": "수평선과 램프 발광부가 보이기 시작하는 시선 사이의 각도 (클수록 눈부심 적음)", "h1": "수평선과 램프 발광부가 보이기 시작하는 시선 사이의 각도 (클수록 눈부심 적음)", "h2": "눈뽕 안 맞게 갓이 가려주는 그늘 각도!", "freq": "-", "src": "전기요약집 p.121"}, {"id": 532, "chap": "11 조명", "topic": "광원", "q": "크세논 램프(Xenon Lamp)의 주 용도 2가지는?", "ans": "① 영화 영사기 광원 ② 탐조등 및 영사 조명", "h1": "① 영화 영사기 광원 ② 탐조등 및 영사 조명", "h2": "영사실 영사기와 하늘 쏘는 서치라이트는 크세논!", "freq": "-", "src": "공사요약집 p.221"}, {"id": 533, "chap": "11 조명", "topic": "조명기구", "q": "투광조명 시 기구 배치 시 고려사항 2가지는?", "ans": "① 피조면 전체 조도 균일도 확보 ② 주변 주민에 대한 빛공해(눈부심) 방지", "h1": "① 피조면 전체 조도 균일도 확보 ② 주변 주민에 대한 빛공해(눈부심) 방지", "h2": "운동장 골고루 비추고, 옆 아파트 주민 눈부시지 않게 갓 숙이기!", "freq": "-", "src": "공사요약집 p.221"}, {"id": 534, "chap": "11 조명", "topic": "안전기준", "q": "작업면 조도 기준 중 초정밀 작업의 조도 기준은?", "ans": "750 [lx] 이상 (산업안전보건기준)", "h1": "750 [lx] 이상 (산업안전보건기준)", "h2": "초정밀 현미경 납땜은 최소 750럭스 이상 밝게!", "freq": "-", "src": "전기요약집 p.122"}, {"id": 535, "chap": "11 조명", "topic": "배선설계", "q": "조명 분기회로 용량은 통상 몇 A 분기회로로 설계하는가?", "ans": "16 [A] 또는 20 [A] 배선차단기 분기회로", "h1": "16 [A] 또는 20 [A] 배선차단기 분기회로", "h2": "조명 라인은 16A나 20A 차단기로 묶는다!", "freq": "-", "src": "공사요약집 p.222"}, {"id": 536, "chap": "12 배선·방폭", "topic": "방폭", "q": "방폭형 전동기란 무엇인지 설명하시오.", "ans": "지정된 폭발성 가스 중에서 사용하기에 적합하도록 구조 기타에 관하여 특별히 고려된 전동기", "h1": "지정된 폭발성 가스 중에서 사용하기에 적합하도록 구조 기타에 관하여 특별히 고려된 전동기", "h2": "폭발성 가스 방(방폭)에서 안 터지게 특(특별히) 만든 모터!", "freq": "★★★ 6회", "src": "[24-3] [22-3] [20-4] [14-2] [14-1] [07-2]"}, {"id": 537, "chap": "12 배선·방폭", "topic": "방폭", "q": "전기설비의 방폭구조 종류 6가지를 쓰시오.", "ans": "① 내압 방폭구조(d) ② 유입 방폭구조(o) ③ 압력 방폭구조(p) ④ 안전증 방폭구조(e) ⑤ 본질안전 방폭구조(i) ⑥ 특수 방폭구조(s)", "h1": "[유·압·안·내·본·특] (d·o·p·e·i·s)", "h2": "방폭구조 외우기: 유(유입) 압(압력) 안(안전증) 내(내압) 본(본질안전) 특(특수)!", "freq": "★★★ 6회", "src": "[24-3] [22-3] [20-4] [14-2] [14-1] [07-2]"}, {"id": 538, "chap": "12 배선·재료", "topic": "금속관", "q": "금속관 공사에서 후강 전선관과 박강 전선관의 호칭 기준은?", "ans": "후강: 안지름 짝수 호칭 (16, 22, 28...) / 박강: 바깥지름 홀수 호칭 (19, 1": "교류(AC)", "h2": "KEC 저압 확장: 교류는 천(1000V)원, 직류는 천오백(1500V)원!", "freq": "★★★ 5회", "src": "[25-1] [23-1] [22-2] [21-2] [21-1]"}, {"id": 555, "chap": "13 KEC", "topic": "불평형률", "q": "3상 설비 불평형률 30[%] 제한을 따르지 않아도 되는 예외 경우 4가지는?", "ans": "① 저압 수전에서 전용 변압기로 수전하는 경우\n② 고·특고압 수전에서 100kVA 이하 단상부하인 경우\n③ 단상부하 용량 최대-최소 차가 100kVA 이하인 경우\n④ 특고압 수전에서 100kVA 이하 단상TR 2대로 역V결선하는 경우", "h1": "[저전용 · 단상 100 · 차이 100 · 역V 100]", "h2": "불평형 예외: 저(저압전용) 단(단상 100) 차(차이 100) 역(역V 100)!", "freq": "★★★ 8회", "src": "[11-2] [10-3] [09-1] [05-2] [05-1] [04-3] [04-2] [03-2]"}, {"id": 556, "chap": "13 KEC", "topic": "특별저압", "q": "특별저압(ELV)의 전압 기준과 종류 3가지는?", "ans": "전압: AC 50V 이하, DC 120V 이하 / 종류: SELV(안전특별저압), PELV(보호특별저압), FELV(기능특별저압)", "h1": "전압", "h2": "ELV 전압: 교류 50V, 직류 120V! 3총사: S(안전) P(보호) F(기능)!", "freq": "★ 2회", "src": "[22-2] [21-1]"}, {"id": 557, "chap": "13 KEC", "topic": "과전류보호", "q": "과전류 차단기의 설치 위치 원칙은?", "ans": "간선의 전원측 전선 굵기가 작아지는 분기점에 시설", "h1": "간선의 전원측 전선 굵기가 작아지는 분기점에 시설", "h2": "전선이 가늘어지는 분기점마다 과전류 차단기 필수!", "freq": "-", "src": "전기요약집 p.125"}, {"id": 558, "chap": "13 KEC", "topic": "분기회로", "q": "분기회로 개폐기 및 과전류차단기는 분기점으로부터 몇 m 이내에 설치하는가?", "ans": "원칙: 3 [m] 이하 (전선 허용전류가 간선 허용전류의 35% 이상 시 8m 이하, 55% 이상 시 제한 없음)", "h1": "원칙", "h2": "원칙은 3미터 이내! 35% 굵기면 8m, 55% 넘으면 무제한!", "freq": "★★ 3회", "src": "[19-1] [13-2] [05-1]"}, {"id": 559, "chap": "13 KEC", "topic": "전압강하", "q": "KEC 저압 수전 수용가 배전선로 전압강하 기준(조명/기타)은?", "ans": "저압 수전: 조명 3% 이하, 기타(동력) 5% 이하 (변전소 수전: 조명 6%, 기타 8%)", "h1": "저압 수전", "h2": "저압은 조명 3% 기타 5%, 변전소 수전은 조명 6% 기타 8%!", "freq": "★ 2회", "src": "[22-3] [21-2]"}, {"id": 560, "chap": "13 KEC", "topic": "누전보호", "q": "지락사고 시 자동 전원차단 장치 설치가 면제되는 장소는?", "ans": "이중절연 구조 기기, 절연변압기로 분리된 회로, SELV·PELV 계통", "h1": "이중절연 구조 기기, 절연변압기로 분리된 회로, SELV·PELV 계통", "h2": "이중 절연된 안전 기기는 누전차단기 면제!", "freq": "-", "src": "전기요약집 p.126"}, {"id": 561, "chap": "13 KEC", "topic": "절연거리", "q": "특고압 가공전선과 식물(나무) 사이의 이격거리 기준은?", "ans": "상시 부는 바람에 접촉하지 아니하도록 시설 (이격거리 수치 규정 폐지)", "h1": "상시 부는 바람에 접 src": "[21-3]"}, {"id": 569, "chap": "13 KEC", "topic": "보호장치", "q": "SPD의 I등급 시험과 II등급 시험의 시험파형은?", "ans": "I등급: 10/350 [㎲] 임펄스 전류 / II등급: 8/20 [㎲] 서지 전류", "h1": "I등급", "h2": "1등급 직격뢰 파형은 10/350, 2등급 유도뢰 파형은 8/20!", "freq": "★ 2회", "src": "[25-2] [21-2]"}, {"id": 570, "chap": "13 KEC", "topic": "수뢰부", "q": "외부 피뢰시스템 수뢰부 시스템 배치 3가지 방법은?", "ans": "① 보호각법 ② 회전구체법 ③ 메시법", "h1": "① 보호각법 ② 회전구체법 ③ 메시법", "h2": "피뢰침 배치 3총사: 각도재기(보호각), 공굴리기(회전구체), 그물치기(메시)!", "freq": "★ 2회", "src": "[21-2] [16-3]"}, {"id": 571, "chap": "13 KEC", "topic": "인하도선", "q": "피뢰시스템에서 자연적 구성부재로 사용할 수 있는 건축 구조재는?", "ans": "철골 구조물의 상호 전기적으로 연속된 금속 기둥 및 철근 콘크리트의 철근", "h1": "철골 구조물의 상호 전기적으로 연속된 금속 기둥 및 철근 콘크리트의 철근", "h2": "건물 철골 기둥과 콘크리트 속 철근을 피뢰 전선으로 재활용!", "freq": "★ 1회", "src": "[21-2]"}, {"id": 572, "chap": "13 KEC", "topic": "변전소보안", "q": "특고압 변전소 부지 경계책 울타리 높이와 충전부 합계 거리(154kV)는?", "ans": "울타리 높이: 2m 이상 / 154kV 합계 거리: 6m 이상 (울타리 높이 2m + 충전부 거리 4m = 6m)", "h1": "울타리 높이", "h2": "154kV는 울타리 높이 더해서 최소 6미터 이상 떨어져라!", "freq": "★ 2회", "src": "[18-2] [09-3]"}, {"id": 573, "chap": "13 KEC", "topic": "변전소보안", "q": "특고압 가공전선로 지표상 높이 기준(35kV 이하 / 154kV)은?", "ans": "35kV 이하: 5m 이상 (도로 횡단 시 6m) / 154kV: 평지 6m 이상 (도로 横단 등 특수 10.4m)", "h1": "35kV 이하", "h2": "35kV 이하는 5m, 154kV 전선은 최소 6m(단수 가산) 높이 띄우기!", "freq": "-", "src": "전기요약집 p.128"}, {"id": 574, "chap": "13 KEC", "topic": "터널배선", "q": "터널 내 저압 배선 시설 시 전선 굵기 및 지표상 높이 기준은?", "ans": "전선 굵기: 절연전선 2.5㎟ 이상 / 지표상 높이: 2.5m 이상", "h1": "전선 굵기", "h2": "터널 배선은 둘다 이점오: 굵기 2.5스퀘어, 높이 2.5미터!", "freq": "-", "src": "공사요약집 p.204"}, {"id": 575, "chap": "13 KEC", "topic": "전선색상", "q": "KEC 전선 식별 색상을 쓰시오. (L1·L2·L3·N·보호도체)", "ans": "L1: 갈색 / L2: 흑색 / L3: 회색 / N: 청색 / 보호도체: 녹색-노란색 줄무늬", "h1": "L1", "h2": "갈(갈비) 흑(흑돼지) 회(회) 먹고 청(청구서) 나오자 녹·노(녹초 된 노인네가 낸다)!", "freq": "★ 2회", "src": "[22-2] [08-2]"}, {"id": 576, "chap": "13 KEC", "topic": "배선기호", "q": "CV선과 TFR-CV선의 정식 명칭을 쓰시오.", "ans": "CV: 가교 폴리에틸렌 절연 비닐 시스 케이블 / TFR-CV: 트레이용 난연 가교 폴리에틸렌 절연 비닐 시스 케이블", "h1": "CV", "h2": "CV는 가교PE 강, 경고는 노랑, 지시는 파랑, 안내는 녹색!", "freq": "-", "src": "공사요약집 p.248"}, {"id": 601, "chap": "14 감리", "topic": "공정관리", "q": "네트워크 공정표에서 임계경로(Critical Path)란 무엇인가?", "ans": "최초 작업부터 최종 작업까지 여유시간이 없는 가장 긴 경로 (공사 기간을 결정함)", "h1": "최초 작업부터 최종 작업까지 여유시간이 없는 가장 긴 경로 (공사 기간을 결정함)", "h2": "여유 1초도 없는 똥줄 타는 최장 공정선 = 임계경로!", "freq": "★★ 3회", "src": "[23-2] [15-3] [07-2]"}, {"id": 602, "chap": "14 감리", "topic": "공정관리", "q": "공정관리 바차트(Gantt Chart)의 장단점을 쓰시오.", "ans": "장점: 작성이 쉽고 진척도 파악이 직관적 / 단점: 작업 간 상호 연관성 및 임계경로 파악 곤란", "h1": "장점", "h2": "간트차트는 보기는 쉬운데 뒤엉킨 작업 연결고리를 못 본다!", "freq": "-", "src": "전기요약집 p.247"}, {"id": 603, "chap": "14 감리", "topic": "공사변경", "q": "설계변경 사유 3가지를 쓰시오.", "ans": "① 현장 상태가 설계도서와 상이할 때 ② 발주자의 요구로 설계가 변경될 때 ③ 신기술·신공법 적용으로 공사비 절감 가능할 때", "h1": "① 현장 상태가 설계도서와 상이할 때 ② 발주자의 요구로 설계가 변경될 때 ③ 신기술·신공법 적용으로 공사비 절감 가능할 때", "h2": "땅 파보니 딴판이거나, 건축주 변덕 부리거나, 더 좋은 신공법 찾았을 때!", "freq": "-", "src": "전기요약집 p.247"}, {"id": 604, "chap": "14 감리", "topic": "감리보고서", "q": "감리원이 매월 정기적으로 발주자에게 보고하는 보고서 명칭은?", "ans": "월간 감리보고서", "h1": "월간 감리보고서", "h2": "한 달에 한 번 찍어 올리는 월간 감리보고서!", "freq": "-", "src": "공사요약집 p.249"}, {"id": 605, "chap": "14 감리", "topic": "사고보고", "q": "현장에서 중대 안전사고 발생 시 감리원의 조치 순서는?", "ans": "즉시 작업중지 지시 → 응급처치 및 병원 이송 → 발주자 및 관계 관청 긴급 보고 → 원인 조사 및 재발방지대책 수립", "h1": "환자 살리고", "h2": "작업 올스톱", "freq": "-", "src": "전기요약집 p.248"}, {"id": 606, "chap": "14 감리", "topic": "공사중지", "q": "감리원이 부분중지를 지시할 수 있는 사유 4가지는?", "ans": "① 재시공 미이행 하자 우려 ② 중대한 위험 예상 ③ 동일공정 3회 이상 시정 미이행 ④ 동일공정 2회 이상 경고 미이행", "h1": "① 재시공 미이행 하자 우려 ② 중대한 위험 예상 ③ 동일공정 3회 이상 시정 미이행 ④ 동일공정 2회 이상 경고 미이행", "h2": "감리원 분노 폭발: 재(재수없게) 중(중대위험 내고) 시(시정 3번) 경(경고 2번) 무시할 때!", "freq": "-", "src": "전기요약집 p.246"}, {"id": 607, "chap": "14 감리", "topic": "감리원배치", "q": "감리원 배치기준 중 총괄감리원과 분야별 감리원의 자격 기준은?", "ans": "총괄: 특급감리원 이상 / 분야별: 해당 분야 고급 또는 중급 감리원 이상", "h1": "총괄", "h2": "대장(총괄)은 특급, 팀원(분야별)은 중·고급 감리원!", "freq": "-", "src": "공사요약집 p.250"}, {"id": 608, "chap": "14 감리", "topic": "하자보수", "q": "전기공사의 하자담보 책임기간(일반 공사 기준)은 몇 년인가?", "ans": "1 년 (변전설비·조명기구 등 일반 1년, 옥외 배전 2년)", "h1": "1 년 (변전설비·조명기구 등 일반 1년, 옥외 배전 2년)", "h2": "전기공사 기본 무상 AS는 1년!", "freq": "-", "src": "전기요약집 p.249"}, {"id": 609, "chap": "14 감리", "topic": "안전보건관리비", "q": "산업안전보건관리비의 계상 목적을 쓰시오.", "ans": "근로자의 산업재해 및 건강장해 예방을 위한 안전시설비, 보호구 구입비, 교육비 등에 전용하기 위함", "h1": "근로자의 산업재해 및 건강장해 예방을 위한 안전시설비, 보호구 구입비, 교육비 등에 전용하기 위함", "h2": "현장 안전모 사고 그물망 치라고 법으로 떼어놓는 안전 전용 예산!", "freq": "-", "src": "전기요약집 p.249"}, {"id": 610, "chap": "14 감리", "topic": "안전보건관리비", "q": "안전관리비로 사용할 수 없는 항목 2가지는?", "ans": "① 작업 편의용 일반 도구·공구 구입 ② 환경관리 및 복리후생 시설비", "h1": "① 작업 편의용 일반 도구·공구 구입 ② 환경관리 및 복리후생 시설비", "h2": "안전모는 되지만 드릴 공구 사거나 회식비로 쓰면 감옥 간다!", "freq": "-", "src": "공사요약집 p.251"}, {"id": 611, "chap": "14 감리", "topic": "감리원권한", "q": "감리원이 시공자에게 시정지시를 서면으로 내려야 하는 사유는?", "ans": "설계도서와 상이한 시공, 품질시험 불합격, 안전관리 미흡 등 중대 결함", "h1": "설계도서와 상이한 시공, 품질시험 불합격, 안전관리 미흡 등 중대 결함", "h2": "말로 때우지 말고 문서(서면)로 공식 시정명령 날리기!", "freq": "-", "src": "공사요약집 p.251"}, {"id": 612, "chap": "14 감리", "topic": "시공확인", "q": "은폐 또는 매몰되는 공사의 감리원 확인 절차는?", "ans": "콘크리트 타설 등 매몰 전에 반드시 현장 입회 검측하고 사진 촬영 및 기록 보관", "h1": "콘크리트 타설 등 매몰 전에 반드시 현장 입회 검측하고 사진 촬영 및 기록 보관", "h2": "시멘트 붓고 묻히면 영원히 못 본다: 묻기 전에 검측하고 사진 찰칵!", "freq": "-", "src": "전기요약집 p.250"}, {"id": 613, "chap": "14 감리", "topic": "적격심사", "q": "전기공사 입찰 적격심사 평가 항목 3가지는?", "ans": "① 시공경험 (실적) ② 경영상태 (신용도) ③ 입찰가격", "h1": "① 시공경험 (실적) ② 경영상태 (신용도) ③ 입찰가격", "h2": "입찰 통과 3대장: 실적(시공경험), 재정건전성(경영상태), 착한 견적(입찰가격)!", "freq": "-", "src": "공사요약집 p.252"}, {"id": 614, "chap": "14 감리", "topic": "원가계산", "q": "표준품셈이란 무엇인지 설명하시오.", "ans": "정부 등 공공기관이 공사비 산정의 기준으로 정한 단위 작업당 소요되는 재료량, 노무량, 기계 사용량의 기준", "h1": "정부 등 공공기관이 공사비 산정의 기준으로 정한 단위 작업당 소요되는 재료량, 노무량, 기계 사용량의 기준", "h2": "전선 1미터 까는 데 인부 몇 시간 드나 정해둔 나라 공인 레시피!", "freq": "-", "src": "전기요약집 p.251"}, {"id": 615, "chap": "14 감리", "topic": "노무비", "q": "공사원가에서 직접노무비와 간접노무비의 차이를 쓰시오.", "ans": "직접노무비: 현장 시공에 직접 종사하는 작업자의 인건비 / 간접노무비: 현장 소장, 안전관리자 등 보조 인력 인건비", "h1": "직접노무비", "h2": "삽 쥐고 뛴 인부는 직접노무비, 사무실 소장님은 간접노무비!", "freq": "-", "src": "전기요약집 p.251"}, {"id": 616, "chap": "14 감리", "topic": "할증률", "q": "전선관 배관 및 전선 포설 시 표준 품셈 전선 할증률(옥내옥외)은?", "ans": "옥내 옥외 케이블: 옥내 10%, 옥외 5% / 옥내 전선: 5% (특고압 케이블 3%)", "h1": "옥내 옥외 케이블", "h2": "자르고 버리는 여유분: 옥내 케이블 10%, 옥외는 5%!", "freq": "-", "src": "공사요약집 p.253"}, {"id": 617, "chap": "14 감리", "topic": "할증률", "q": "철탑 공사 시 자재 할증률(볼트, 너트)은 몇 %인가?", "ans": "3 [%]", "h1": "3 [%]", "h2": "철탑 볼트 너트는 굴러 떨어지니까 3% 여유 추가!", "freq": "-", "src": "공사요약집 p.253"}, {"id": 618, "chap": "14 감리", "topic": "감리일지", "q": "감리원이 매일 작성하는 감리일지에 기록해야 할 사항 4가지는?", "ans": "① 당일 기상 조건 ② 시공 작업 내용 및 인원 현황 ③ 주요 자재 반입 현황 ④ 지시사항 및 특기사항", "h1": "① 당일 기상 조건 ② 시공 작업 내용 및 인원 현황 ③ 주요 자재 반입 현황 ④ 지시사항 및 특기사항", "h2": "일기 쓰듯: 날씨, 오늘 한 일과 사람 수, 들어온 자재, 잔소리 지시사항!", "freq": "-", "src": "전기요약집 p.252"}, {"id": 619, "chap": "14 감리", "topic": "안전점검", "q": "특별안전보건교육을 실시해야 하는 작업 2가지는?", "ans": "① 고압·특고압 활선작업 및 활선근접작업 ② 밀폐공간(맨홀, 정화조) 질식 위험 작업", "h1": "① 고압·특고압 활선작업 및 활선근접작업 ② 밀폐공간(맨홀, 정화조) 질식 위험 작업", "h2": "2만2천볼트 전선 만질 때랑 질식 위험 맨홀 들어갈 때 특별교육!", "freq": "-", "src": "공사요약집 p.254"}, {"id": 620, "chap": "14 감리", "topic": "공사원가", "q": "공사원가 계산 시 5대 비목을 쓰시오.", "ans": "① 재료비 ② 노무비 ③ 경비 ④ 일반관리비 ⑤ 이윤", "h1": "[재·노·경·일·이]", "h2": "돈 계산할 때: 재(재수 없는) 노(노인네) 경(경찰서로) 일(일찍) 이(이송)!", "freq": "-", "src": "350제 146번"}, {"id": 621, "chap": "15 측정·시험", "topic": "절연저항", "q": "KEC 저압전로의 사용전압별 시험전압과 절연저항 기준값을 쓰시오.", "ans": "SELV·PELV: DC 250[V], 0.5[MΩ] 이상\nFELV, 500[V] 이하: DC 500[V], 1.0[MΩ] 이상\n500[V] 초과: DC 1,000[V], 1.0[MΩ] 이상", "h1": "[250-0.5 / 500-1.0 / 1000-1.0]", "h2": "이오(250)에 빵오(0.5)! 오백(500)에 하나(1.0)! 천(1000)에도 하나(1.0)!", "freq": "★★ 4회", "src": "[21-3] [21-1] [16-3] [14-2]"}, {"id": 622, "chap": "15 측정·시험", "topic": "절연저항", "q": "메거(Megger, 절연저항계)의 측정 전압 종류와 용도는?", "ans": "저압: DC 500V 또는 250V / 고압·특고압: DC 1000V 또는 2000V 메거 사용", "h1": "저압", "h2": "저압 전선은 500V 메거, 특고압 기기는 1000V 메거로 빵 쏴서 측정!", "freq": "★ 2회", "src": "[21-3] [16-3]"}, {"id": 623, "chap": "15 측정·시험", "topic": "절연저항", "q": "절연저항 측정 시 회로의 전원을 차단(정전)해야 하는 이유는?", "ans": "활선 상태에서 측정 시 메거 내부 회로 소손 및 부정확한 지시 발생", "h1": "활선 상태에서 측정 시 메거 내부 회로 소손 및 부정확한 지시 발생", "h2": "전기 살아있는데 메거 대면 메거 계측기가 펑 타버린다!", "freq": "-", "src": "전기요약집 p.253"}, {"id": 624, "chap": "15 측정·시험", "topic": "절연내력", "q": "고압 및 특고압 전로의 절연내력 시험방법(인가 시간)을 쓰시오.", "ans": "최대사용전압에 의해 결정되는 시험전압을 전로와 대지 사이에 연속하여 10분간 가한다.", "h1": "최대사용전압에 의해 결정되는 시험전압을 전로와 대지 사이에 연속하여 10분간 가한다.", "h2": "절연내력 시험은 전로와 대지 사이에 무조건 10분간(십분) 연속 발휘!", "freq": "★★ 3회", "src": "[21-3] [16-3] [14-2]"}, {"id": 625, "chap": "15 측정·시험", "topic": "절연내력", "q": "절연내력 시험전압 배수(7kV 이하 / 7kV 초과 25kV 이하 중성점접지)는?", "ans": "7kV 이하: 1.5배 (최저 500V) / 7kV 초과 25kV 이하 다중접지: 0.92배", "h1": "7kV 이하", "h2": "7kV 이하는 1.5배! 22.9kV 다중접지는 공포의 0.92배!", "freq": "★★ 4회", "src": "[23-3] [08-1] [03-3] [02-3]"}, {"id": 626, "chap": "15 측정·시험", "topic": "절연내력", "q": "154kV 비접지 또는 중성점 직접접지 선로의 절연내력 시험전압 배수는?", "ans": "154kV 직접접지: 0.72배 (154,000 × 0.72 = 110,880V) 연속 10분", "h1": "154kV 직접접지", "h2": "154kV 직접접지는 0.72배 빵 때리기!", "freq": "★ 2회", "src": "[08-1] [02-3]"}, {"id": 627, "chap": "15 측정·시험", "topic": "절연내력", "q": "최대사용전압 6,900V 변압기의 절연내력 시험전압과 인가시간은?", "ans": "시험전압 = 6,900 × 1.5 = 10,350 [V], 연속 10분간", "h1": "시험전압 = 6,900 × 1.5 = 10,350 [V], 연속 10분간", "h2": "7kV 이하는 1.5배! 6,900에 1.5 곱하면 만삼백오십(10,350V) 연속 10분!", "freq": "★★ 4회", "src": "[23-3] [08-1] [03-3] [02-3]"}, {"id": 628, "chap": "15 측정·시험", "topic": "절연내력", "q": "절연내력 시험회로에서 PT와 전류계(mA)의 설치 목적을 쓰시오.", "ans": "PT: 피시험기에 인가되는 시험전압 측정 / 전류계(mA): 피시험기의 누설전류 측정", "h1": "PT", "h2": "PT는 전압재기(시험전압), 작은 mA계는 찔끔 새는 누설전류재기!", "freq": "★★ 4회", "src": "[23-3] [08-1] [03-3] [02-3]"}, {"id": 629, "chap": "15 측정·시험", "topic": "누설전류", "q": "KEC 규정에 따른 저압 전선로의 누설전류 허용 한도는?", "ans": "최대공급전류의 1/2000 이하 (단상 1선 지락전류 1mA 이하 유지)", "h1": "최대공급전류의 1/2000 이하 (단상 1선 지락전류 1mA 이하 유지)", "h2": "이천분의 일(1/2000) 이하로만 새어야 합격!", "freq": "★★ 3회", "src": "[21-3] [14-2] [06-1]"}, {"id": 630, "chap": "15 측정·시험", "topic": "검상기", "q": "검상기(Phase Tester)의 측정 목적은?", "ans": "3상 교류 전원의 상회전 방향(R-S-T 또는 L1-L2-L3 상순)을 확인하기 위함", "h1": "3상 교류 전원의 상회전 방향(R-S-T 또는 L1-L2-L3 상순)을 확인하기 위함", "h2": "모터 역회전 막으려고 상회전 순서(상순) 확인하는 검상기!", "freq": "★ 1회", "src": "[17-2]"}, {"id": 631, "chap": "15 측정·시험", "topic": "계측기", "q": "훅온 메터(클램프 메터)의 사용 목적과 장점은?", "ans": "목적: 활선 상태의 부하전류 측정 / 장점: 전선을 끊지 않고 클램프로 둘러싸서 안전하고 간편하게 측정", "h1": "목적", "h2": "전선 자르지 않고 집게로 콕 집어서 전류 재는 클램프 메터!", "freq": "★ 2회", "src": "[18-3] [05-1]"}, {"id": 632, "chap": "15 측정·시험", "topic": "적산전력계", "q": "교류 적산전력계의 잠동(Creeping) 현상이란?", "ans": "무부하 상태에서 정격주파수 및 정격전압의 110[%]를 인가했을 때 원판이 1회전 이상 회전하는 현상", "h1": "무부하 상태에서 정격주파수 및 정격전압의 110[%]를 인가했을 때 원판이 1회전 이상 회전하는 현상", "h2": "전기 안 쓰는데(무부하 110%) 계량기 혼자 뺑글 한 바퀴(1회전) 도는 유령 현상!", "freq": "★★ 3회", "src": "[18-3] [05-3] [05-1]"}, {"id": 633, "chap": "15 측정·시험", "topic": "적산전력계", "q": "적산전력계의 잠동을 막기 위한 방법 2가지를 쓰시오.", "ans": "① 원판에 작은 구멍을 뚫는다 ② 원판에 작은 철편을 붙인다", "h1": "① 원판에 작은 구멍을 뚫는다 ② 원판에 작은 철편을 붙인다", "h2": "잠동 도둑 잡기: 원판에 구멍 뚫거나 작은 쇳조각(철편) 붙여 밸런스 잡기!", "freq": "★★ 3회", "src": "[18-3] [05-3] [05-1]"}, {"id": 634, "chap": "15 측정·시험", "topic": "적산전력계", "q": "적산전력계가 구비해야 할 특성 4가지를 쓰시오.", "ans": "① 과부하 내량이 클 것 ② 부하 특성이 좋을 것 ③ 온도·주파수 변화에 보상될 것 ④ 기계적 강도가 클 것", "h1": "[과·부·주·기]", "h2": "계량기 구비조건: 과(과부하 튼튼) 부(부하특성 굿) 주(주파수온도 보상) 기(기계적 강도)!", "freq": "★★ 3회", "src": "[18-3] [05-3] [05-1]"}, {"id": 635, "chap": "15 측정·시험", "topic": "오차계산", "q": "계측기 백분율 오차 공식 ε = (M - T) / T × 100 [%]의 기호는?", "ans": "M: 측정값, T: 참값 (참값에 대한 측정 오차의 비율)", "h1": "M", "h2": "오차는 (측정값 - 진짜값) 나누기 진짜값! 곱하기 백!", "freq": "-", "src": "전기요약집 p.254"}, {"id": 636, "chap": "15 측정·시험", "topic": "온도상승", "q": "변압기 온도상승 시험방법 3가지를 쓰시오.", "ans": "① 실부하법 ② 반환부하법 (홉킨슨법, 카프법) ③ 등가부하법", "h1": "[실·반·등]", "h2": "변압기 땀 흘리기 시험: 실(실부하) 반(반환부하) 등(등가부하)!", "freq": "★ 2회", "src": "[12-1] [03-2]"}, {"id": 637, "chap": "15 측정·시험", "topic": "변압기시험", "q": "유입 변압기 절연유의 절연파괴전압 시험 기준은?", "ans": "구상 전극 간격 2.5mm에서 신유는 30 [kV] 이상, 사용유는 20 [kV] 이상", "h1": "구상 전극 간격 2.5mm에서 신유는 30 [kV] 이상, 사용유는 20 [kV] 이상", "h2": "새 기름은 30kV, 헌 기름은 20kV 스파크에 버 량에 따라 발전량 변동 심함 ② 에너지 밀도가 낮아 넓은 설치 면적 필요 ③ 초기 설비 투자비 고가", "h2": "태양광 약점: 비 오면 꽝(변동 심함), 땅 많이 먹고(면적 큼), 초기 비용 비싸다!", "freq": "★ 2회", "src": "[19-1] [11-2]"}, {"id": 645, "chap": "16 신재생", "topic": "태양광", "q": "태양광 모듈 인버터의 단독운전 방지 기능이란?", "ans": "한전 계통 정전 시 분산전원이 단독으로 선로에 가압되는 것을 감지하여 인버터를 계통에서 즉시 분리하는 보호 기능", "h1": "한전 계통 정전 시 분산전원이 단독으로 선로에 가압되는 것을 감지하여 인버터를 계통에서 즉시 분리하는 보호 기능", "h2": "한전 꺼졌는데 혼자 전기 보내다 감전 사고 내는 단독운전을 0.5초 만에 칼 차단!", "freq": "★★ 3회", "src": "[23-2] [19-1] [16-2]"}, {"id": 646, "chap": "16 신재생", "topic": "태양광", "q": "태양광 발전 인버터의 주요 기능 4가지를 쓰시오.", "ans": "① 직류(DC)를 교류(AC)로 변환 ② 최대출력추종제어(MPPT) ③ 단독운전 방지 기능 ④ 자동운전 및 정지 기능", "h1": "AC 변환, 햇빛 따라 MPPT 최대출력 뽑기, 단독운전 차단, 자동 ON/OFF!", "h2": "인버터의 4대 임무: DC", "freq": "★★ 3회", "src": "[23-2] [19-1] [16-2]"}, {"id": 647, "chap": "16 신재생", "topic": "태양광", "q": "MPPT(Maximum Power Point Tracking) 제어란 무엇인가?", "ans": "일사량 및 온도 변화에 따라 시시각각 변하는 태양전지의 P-V 곡선에서 항상 최대 출력을 내도록 제어하는 기능", "h1": "일사량 및 온도 변화에 따라 시시각각 변하는 태양전지의 P-V 곡선에서 항상 최대 출력을 내도록 제어하는 기능", "h2": "햇빛 변할 때마다 가장 꿀 나오는 황금 출력 포인트를 실시간 추적!", "freq": "★ 2회", "src": "[23-2] [19-1]"}, {"id": 648, "chap": "16 신재생", "topic": "풍력", "q": "풍력 발전 시스템의 기본 구성요소 3가지는?", "ans": "① 블레이드 (날개) ② 증속기 (기어박스) ③ 발전기 (제어기, 타워)", "h1": "① 블레이드 (날개) ② 증속기 (기어박스) ③ 발전기 (제어기, 타워)", "h2": "바람개비(블레이드) 돌려 기어로 속도 높여(증속기) 발전기 돌리기!", "freq": "-", "src": "전기요약집 p.255"}, {"id": 649, "chap": "16 신재생", "topic": "ESS", "q": "에너지 저장장치(ESS)의 기본 구성 3요소는?", "ans": "① 배터리 (축전지) ② BMS (배터리 관리 시스템) ③ PCS (전력변환장치)", "h1": "① 배터리 (축전지) ② BMS (배터리 관리 시스템) ③ PCS (전력변환장치)", "h2": "ESS 삼위일체: 밧데리(배터리) + 두뇌(BMS) + 전력변환(PCS)!", "freq": "★ 2회", "src": "[22-3] [18-2]"}, {"id": 650, "chap": "16 신재생", "topic": "ESS", "q": "BMS(Battery Management System)의 역할 3가지는?", "ans": "① 셀별 전압 및 온도 감시 ② 과충전·과방전 보호 ③ 셀 밸런싱 제어", "h1": "① 셀별 전압 및 온도 감시 ② 과충전·과방전 보호 ③ 셀 밸런싱 제어", "h2": "배터리 안 터지게: 전압온도 감시, 과충전 방어, 셀 전압 똑같이 맞추기(밸런싱)!", "freq": "★ 2회", "src": "[22-3] [18-2]"}, {"id": 651, "chap": "16 신재생", "topic": "분산형전원", "q": "분산형 전원 연계 시 계통에 미치는 영향 3가지는?", "ans": "① 전압 변동 및 역조류 발생 ② 단락용량 증대 ③ 계통 보호협조 곤란", "h1": "① 전압 변동 및 역조류 발생 ② 단락용량 증대 ③ 계통 보호협조 곤란", "h2": "태양광 막 꽂으면: 전기가 거꾸로 흐르고(역조류), 전압 출렁이고, 차단기 보호협조 꼬인다!", "freq": "★ 2회", "src": "[24-1] [19-1]"}, {"id": 652, "chap": "16 신재생", "topic": "연료전지", "q": "연료전지(Fuel Cell) 발전의 기본 원리와 장점을 쓰시오.", "ans": "원리: 수소와 산소의 전기화학 반응으로 물이 생성되며 전기와 열을 발생 / 장점: 고효율, 친환경(무공해), 열병합 이용 가능", "h1": "원리", "h2": "수소랑 산소 만나 물 만들며 공짜 전기 뿜는 친환경 미래 발전기!", "freq": "★ 2회", "src": "[20-2] [14-1]"}];

    // State
    let currentMode = 'random'; // 'random', 'chap', 'wrong', 'list'
    let currentQuestion = null;
    let selectedChapter = 'ALL';
    let selectedFreq = 'ALL';
    
    // Persistent Storage in localStorage
    let wrongAnswers = JSON.parse(localStorage.getItem('elec_wrong_answers') || '[]');
    let studyStats = JSON.parse(localStorage.getItem('elec_study_stats') || '{"solved": 0, "correct": 0, "history": {}}');

    // Initialize Chapters dropdown
    function initChapters() {
      const select = document.getElementById('chapter-select');
      const chaps = [...new Set(RAW_QUESTIONS.map(q => q.chap))];
      chaps.forEach(ch => {
        const opt = document.createElement('option');
        opt.value = ch;
        opt.textContent = ch;
        select.appendChild(opt);
      });
    }

    // Mode Selector
    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      
      const quizView = document.getElementById('quiz-view');
      const reviewView = document.getElementById('review-view');
      const filterBar = document.getElementById('filter-bar');

      if (mode === 'random') {
        document.getElementById('tab-random').classList.add('active');
        quizView.style.display = 'flex';
        reviewView.classList.remove('active');
        filterBar.style.display = 'flex';
        drawNextQuestion();
      } else if (mode === 'chap') {
        document.getElementById('tab-chap').classList.add('active');
        quizView.style.display = 'flex';
        reviewView.classList.remove('active');
        filterBar.style.display = 'flex';
        drawNextQuestion();
      } else if (mode === 'wrong') {
        document.getElementById('tab-wrong').classList.add('active');
        filterBar.style.display = 'none';
        if (wrongAnswers.length === 0) {
          showToast('🎉 현재 오답 노트가 비어있습니다! 전체 퀴즈를 먼저 풀어보세요.');
          setMode('random');
          return;
        }
        quizView.style.display = 'flex';
        reviewView.classList.remove('active');
        drawNextQuestion();
      } else if (mode === 'list') {
        document.getElementById('tab-list').classList.add('active');
        quizView.style.display = 'none';
        reviewView.classList.add('active');
        filterBar.style.display = 'none';
        renderReviewList();
      }
      updateStats();
    }

    function onChapterChange() {
      selectedChapter = document.getElementById('chapter-select').value;
      drawNextQuestion();
    }

    function onFreqChange() {
      selectedFreq = document.getElementById('freq-select').value;
      drawNextQuestion();
    }

    // Filter Question Pool
    function getFilteredPool() {
      if (currentMode === 'wrong') {
        const wrongIds = new Set(wrongAnswers.map(w => w.id));
        return RAW_QUESTIONS.filter(q => wrongIds.has(q.id));
      }

      let pool = RAW_QUESTIONS;
      if (selectedChapter !== 'ALL') {
        pool = pool.filter(q => q.chap === selectedChapter);
      }
      if (selectedFreq === 'STAR3') {
        pool = pool.filter(q => q.freq.includes('★★★'));
      } else if (selectedFreq === 'STAR2') {
        pool = pool.filter(q => q.freq.includes('★★★') || q.freq.includes('★★'));
      }
      return pool;
    }

    // Pick Next Question
    function drawNextQuestion(isSkip = false) {
      const pool = getFilteredPool();
      if (!pool || pool.length === 0) {
        alert('선택하신 조건에 해당하는 문제가 없습니다.');
        return;
      }

      // Avoid picking the exact same question consecutively if pool > 1
      let nextQ = pool[Math.floor(Math.random() * pool.length)];
      if (pool.length > 1 && currentQuestion && nextQ.id === currentQuestion.id) {
        const altPool = pool.filter(q => q.id !== currentQuestion.id);
        nextQ = altPool[Math.floor(Math.random() * altPool.length)];
      }

      currentQuestion = nextQ;
      renderCurrentQuestion();
      if (isSkip) showToast('⏭️ 다음 문제로 이동했습니다.');
    }

    // Render Question on Card
    function renderCurrentQuestion() {
      if (!currentQuestion) return;

      document.getElementById('card-no').textContent = 'No. ' + currentQuestion.id;
      document.getElementById('card-chap').textContent = currentQuestion.chap;
      document.getElementById('card-topic').textContent = currentQuestion.topic;
      
      const freqElem = document.getElementById('card-freq');
      freqElem.textContent = currentQuestion.freq;
      freqElem.className = 'tag-freq';
      if (currentQuestion.freq.includes('★★★')) freqElem.classList.add('star3');
      else if (currentQuestion.freq.includes('★★')) freqElem.classList.add('star2');
      else freqElem.classList.add('star1');

      document.getElementById('card-src').textContent = currentQuestion.src;
      document.getElementById('card-q').textContent = currentQuestion.q;

      // Populate hints & answer
      document.getElementById('box-h1').textContent = currentQuestion.h1;
      document.getElementById('box-h2').textContent = currentQuestion.h2;
      document.getElementById('box-ans').textContent = currentQuestion.ans;

      // Collapse all boxes
      collapseAllBoxes();
    }

    function collapseAllBoxes() {
      ['h1', 'h2', 'ans'].forEach(t => {
        document.getElementById('box-' + t).classList.remove('show');
        document.getElementById('icon-' + t).textContent = '▼';
      });
    }

    function toggleHint(num) {
      const box = document.getElementById('box-h' + num);
      const icon = document.getElementById('icon-h' + num);
      box.classList.toggle('show');
      icon.textContent = box.classList.contains('show') ? '▲' : '▼';
    }

    function toggleAnswer() {
      const box = document.getElementById('box-ans');
      const icon = document.getElementById('icon-ans');
      box.classList.toggle('show');
      icon.textContent = box.classList.contains('show') ? '▲' : '▼';
    }

    // Handle Marking
    function markResult(isCorrect) {
      if (!currentQuestion) return;

      studyStats.solved += 1;
      if (isCorrect) {
        studyStats.correct += 1;
        studyStats.history[currentQuestion.id] = 'correct';

        if (currentMode === 'wrong') {
          // Remove from wrong answers
          wrongAnswers = wrongAnswers.filter(w => w.id !== currentQuestion.id);
          saveWrongAnswers();
          showToast('✨ 정답! 오답 노트에서 정복 졸업했습니다!');
          
          if (wrongAnswers.length === 0) {
            showToast('🎉 축하합니다! 오답 노트의 모든 문제를 완벽 정복했습니다!');
            setMode('random');
            return;
          }
        } else {
          showToast('👏 정답입니다! 계속 집중해 보세요.');
        }
      } else {
        studyStats.history[currentQuestion.id] = 'wrong';
        // Add to wrong note if not already in
        const existing = wrongAnswers.find(w => w.id === currentQuestion.id);
        if (existing) {
          existing.count = (existing.count || 1) + 1;
        } else {
          wrongAnswers.push({
            id: currentQuestion.id,
            chap: currentQuestion.chap,
            topic: currentQuestion.topic,
            q: currentQuestion.q,
            ans: currentQuestion.ans,
            count: 1,
            time: new Date().toISOString()
          });
        }
        saveWrongAnswers();
        showToast('🚨 오답 노트에 저장되었습니다! (오답 훈련에서 반복)');
      }

      saveStudyStats();
      updateStats();
      drawNextQuestion();
    }

    function saveWrongAnswers() {
      localStorage.setItem('elec_wrong_answers', JSON.stringify(wrongAnswers));
      updateWrongBadge();
    }

    function saveStudyStats() {
      localStorage.setItem('elec_study_stats', JSON.stringify(studyStats));
    }

    function updateStats() {
      document.getElementById('stat-solved').textContent = studyStats.solved;
      const rate = studyStats.solved > 0 ? Math.round((studyStats.correct / studyStats.solved) * 100) : 0;
      document.getElementById('stat-rate').textContent = rate + '%';
      
      const distinctSolved = Object.keys(studyStats.history).length;
      const progressPercent = Math.min(100, Math.round((distinctSolved / 652) * 100));
      document.getElementById('progress-fill').style.width = progressPercent + '%';

      updateWrongBadge();
    }

    function updateWrongBadge() {
      const count = wrongAnswers.length;
      document.getElementById('stat-wrong').textContent = count;
      const tab = document.getElementById('tab-wrong');
      tab.textContent = '🔥 오답 훈련 (' + count + ')';
      if (count > 0) tab.classList.add('has-wrong');
      else tab.classList.remove('has-wrong');
    }

    // Render Review List
    function renderReviewList() {
      const listContainer = document.getElementById('review-list-items');
      document.getElementById('review-count').textContent = wrongAnswers.length;
      listContainer.innerHTML = '';

      if (wrongAnswers.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding:30px; color:#64748B;">🎉 오답 노트가 비어있습니다. 아주 훌륭합니다!</div>';
        return;
      }

      wrongAnswers.forEach(w => {
        const item = document.createElement('div');
        item.className = 'review-item';
        item.innerHTML = `
          <div class="review-item-header">
            <span>No. ${w.id} [${w.chap}] - ${w.topic}</span>
            <span style="color:var(--danger)">틀린 횟수: ${w.count || 1}회</span>
          </div>
          <div class="review-item-q">${w.q}</div>
          <div class="review-item-a"><strong>정답:</strong><br>${w.ans}</div>
        `;
        listContainer.appendChild(item);
      });
    }

    function clearAllWrongAnswers() {
      if (confirm('오답 노트를 모두 비우시겠습니까?')) {
        wrongAnswers = [];
        saveWrongAnswers();
        renderReviewList();
        showToast('🗑️ 오답 노트가 깨끗이 비워졌습니다.');
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
    }

    // Backup & Restore
    function exportData() {
      const data = {
        stats: studyStats,
        wrong: wrongAnswers,
        exportedAt: new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '전기기사_실기단답_학습데이터_백업.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast('📥 학습 데이터가 파일로 다운로드되었습니다.');
    }

    function importData() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          try {
            const imported = JSON.parse(ev.target.result);
            if (imported.stats && imported.wrong) {
              studyStats = imported.stats;
              wrongAnswers = imported.wrong;
              saveStudyStats();
              saveWrongAnswers();
              updateStats();
              drawNextQuestion();
              showToast('📤 학습 데이터가 성공적으로 복원되었습니다!');
            } else {
              alert('유효하지 않은 백업 파일 형식입니다.');
            }
          } catch (err) {
            alert('파일 읽기 오류: ' + err.message);
          }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    function resetAll() {
      if (confirm('정말로 모든 학습 진도와 오답 노트를 초기화하시겠습니까?')) {
        localStorage.removeItem('elec_wrong_answers');
        localStorage.removeItem('elec_study_stats');
        wrongAnswers = [];
        studyStats = { solved: 0, correct: 0, history: {} };
        updateStats();
        drawNextQuestion();
        showToast('🔄 모든 데이터가 초기화되었습니다.');
      }
    }

    // Keyboard Shortcuts
    window.addEventListener('keydown', e => {
      // Ignore if in inputs
      if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;

      if (e.key === '1') toggleHint(1);
      else if (e.key === '2') toggleHint(2);
      else if (e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault();
        toggleAnswer();
      } else if (e.key === 'ArrowLeft' || e.key === 'x' || e.key === 'X') {
        markResult(false);
      } else if (e.key === 'ArrowRight' || e.key === 'o' || e.key === 'O') {
        markResult(true);
      } else if (e.key === 'n' || e.key === 'N') {
        drawNextQuestion(true);
      }
    });

    // Init App
    window.onload = () => {
      initChapters();
      updateStats();
      drawNextQuestion();
    };
  </script>
</body>
</html>
